       TAILWIND — VIA POSTCSS BUILD
  ========================== -->
  <!-- Tailwind CSS is included via PostCSS during the build process -->
  <!-- Custom theme colors are in tailwind.config.js -->

  <!-- =========================
       CUSTOM GLOBAL STYLES (RED THEME)
  ========================== -->
  <style>
    :root {
      --color-bg-primary:     #0a0000;
      --color-bg-secondary:   #110000;
      --color-bg-tertiary:    #1a0000;
      --color-text-primary:   #ffffff;
      --color-text-secondary: #9ca3af;
      --color-accent:         #ef4444;
      --color-accent-hover:   #dc2626;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--color-bg-primary);
      color: var(--color-text-primary);
      overflow-x: hidden;
      min-height: 100vh;
      line-height: 1.5;
    }

    /* Custom scrollbar */
    .custom-scrollbar { scrollbar-width: thin; scrollbar-color: rgba(239,68,68,0.3) transparent; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: rgba(239,68,68,0.3);
      border-radius: 9999px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background-color: rgba(239,68,68,0.6); }

    /* Selection */
    ::selection      { background-color: rgba(239,68,68,0.3); color: white; }
    ::-moz-selection { background-color: rgba(239,68,68,0.3); color: white; }

    /* Focus */
    *:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }

    /* Reduce motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* Loading screen */
    #loading-screen {
      position: fixed;
      inset: 0;
      background: #0a0000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    #loading-screen.hidden { opacity: 0; pointer-events: none; }

    /* Spinner — red theme */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 44px; height: 44px;
      border-radius: 50%;
      border: 3px solid rgba(239,68,68,0.15);
      border-top-color: #ef4444;
      animation: spin 0.75s linear infinite;
    }

    /* Print */
    @media print {
      body { background: white; color: black; }
      .no-print { display: none !important; }
    }
	
	 /* Critical CSS — above the fold */
  #root { min-height: 100vh; background: #0a0000; }

  <div id="loading-screen">

      <div style="
        width:60px; height:60px; border-radius:10px;
        background:#050a10;
        border:1px solid rgba(239,68,68,0.6);
        box-shadow:0 0 12px rgba(239,68,68,0.35);
        display:flex; align-items:center; justify-content:center;
        margin:0 auto 16px;
      ">
        <svg width="37" height="37" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="axLogoGrad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#f87171"/>
              <stop offset="100%" stop-color="#ef4444"/>
            </linearGradient>
            <filter id="axLogoGlow" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur stdDeviation="1.5" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <!-- Play triangle -->
          <polygon points="4,6 21,16 4,26" fill="url(#axLogoGrad)" filter="url(#axLogoGlow)"/>
          <!-- Pause bar -->
          <rect x="24" y="6" width="4" height="20" rx="2" fill="#ef4444" opacity="0.9"/>
        </svg>
      </div>

      <!-- Wordmark -->
      <h2 style="
        font-size:1.6rem; font-weight:900; letter-spacing:-0.03em;
        line-height:1; margin-bottom:20px;
        font-family: 'Inter', sans-serif;

      </h2>

      <!-- Spinner -->

    </div>
  </div>

  <!-- MAIN APP -->

  <!-- Hide loading screen once app mounts -->
  <script type="module">
    window.addEventListener('load', () => {
      const el = document.getElementById('loading-screen');
      if (el) {
        setTimeout(() => {
          el.classList.add('hidden');
          setTimeout(() => el.remove(), 400);
        }, 500);
      }
    });
  </script>
