<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark rounded box background — matches header logo bg #050a10 -->
  <rect width="64" height="64" rx="14" fill="#050a10"/>

  <!-- Red border glow ring -->
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.7"/>

  <defs>
    <linearGradient id="triGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Play triangle -->
  <polygon points="10,14 42,32 10,50" fill="url(#triGrad)" filter="url(#glow)"/>

  <!-- Pause / skip bar -->
  <rect x="48" y="14" width="7" height="36" rx="3.5" fill="#ef4444" opacity="0.9"/>
</svg>
